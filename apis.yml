name: VICTUS Technologies
description: VICTUS Technologies builds contested-autonomy software for autonomous systems operating
  in GPS-denied and jamming-heavy environments. Its PhantomNAV platform delivers precise state
  estimation from the gravity and inertial sensors already embedded in drones, aircraft, submarines,
  satellites, and ships - no new hardware required - and integrates with Palantir Foundry's AIP
  infrastructure. VICTUS is backed by Techstars and added to the API Evangelist network. The company
  publishes a marketing and platform site but exposes no public developer API, SDK, or documentation
  surface at this time.
